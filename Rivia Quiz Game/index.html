<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Trivia Quiz Game</h1>
        <p>Test your knowledge by answering trivia questions!</p>
    </header>

    <main>
        <div id="question-container">
            <p id="question">Loading question...</p>
        </div>

        <div id="answer-container">
            <button class="answer-btn" id="answer-1">Option 1</button>
            <button class="answer-btn" id="answer-2">Option 2</button>
            <button class="answer-btn" id="answer-3">Option 3</button>
            <button class="answer-btn" id="answer-4">Option 4</button>
        </div>

        <div id="score">
            <p>Score: <span id="score-value">0</span></p>
        </div>

        <button id="next-question" class="next-btn">Next Question</button>
    </main>

    <hr>
    <footer>
        <div class="copyright">
            © 2025 CodeWithAP. All rights reserved.
        </div>
        <a class="github-link" href="https://github.com/AtharvaPatharkar" target="_blank">GitHub</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
